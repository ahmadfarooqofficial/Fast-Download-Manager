<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FDM — Fast Download Manager</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12"/><path d="M18 6 6 18"/>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4.5 2.7 20h18.6L12 4.5Z"/><path d="M12 10v4"/><path d="M12 17h.01"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>
  </symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 13h5l1.5 3h5L16 13h5"/>
    <path d="M5.5 5h13l2.5 8v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5Z"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 3v2m0 14v2M4.2 7.5l1.7 1M18.1 15.5l1.7 1M4.2 16.5l1.7-1M18.1 8.5l1.7-1"/>
  </symbol>
  <symbol id="i-grip" viewBox="0 0 24 24" fill="currentColor">
    <circle cx="8" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/>
    <circle cx="15" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="18" r="1.6"/>
  </symbol>
</svg>

<header class="bar">
  <div class="bar__brand">
    <img src="icons/icon-32.png" width="20" height="20" alt="" aria-hidden="true">
    <span class="bar__name">FDM</span>
  </div>

  <div class="switches-container">
    <label class="switch" title="Toggle automatic download interception">
      <span class="switch__label" id="capture-label">Capture Downloads</span>
      <input type="checkbox" id="capture" role="switch" aria-labelledby="capture-label">
      <span class="switch__track" aria-hidden="true"><span class="switch__knob"></span></span>
    </label>
  </div>
</header>

<div class="sniffer-row">
  <label class="switch" title="Show IDM-style download button on videos and audios across web pages">
    <span class="switch__label" id="sniffer-label">Video &amp; Audio Download Button</span>
    <input type="checkbox" id="sniffer" role="switch" aria-labelledby="sniffer-label">
    <span class="switch__track" aria-hidden="true"><span class="switch__knob"></span></span>
  </label>
</div>

<div class="banner" id="banner" role="status" aria-live="polite" hidden>
  <svg width="16" height="16" aria-hidden="true"><use href="#i-alert"/></svg>
  <span id="banner-text"></span>
  <a href="welcome.html" target="_blank" id="banner-link">Fix this</a>
</div>

<div class="banner banner--info" id="drag-hint" role="status" hidden>
  <svg width="16" height="16" aria-hidden="true"><use href="#i-grip"/></svg>
  <span>Turn on “Allow access to file URLs” for FDM so finished downloads can be dragged out.</span>
  <button type="button" class="link" id="drag-hint-fix">Open settings</button>
</div>

<main>
  <ul class="list" id="list"></ul>

  <div class="empty" id="empty">
    <svg width="26" height="26" aria-hidden="true"><use href="#i-inbox"/></svg>
    <p class="empty__title">Nothing downloading</p>
    <p class="empty__hint" id="empty-hint">
      Start a download in your browser and it will appear here.
    </p>
  </div>
</main>

<footer class="bar bar--footer">
  <a href="welcome.html" target="_blank" class="link">
    <svg width="14" height="14" aria-hidden="true"><use href="#i-gear"/></svg>
    Setup &amp; status
  </a>
  <button type="button" class="link" id="clear" hidden>Clear finished</button>
</footer>

<template id="row-template">
  <li class="row">
    <div class="row__head">
      <svg class="row__handle" width="14" height="14" hidden aria-hidden="true"><use href="#i-grip"/></svg>
      <span class="row__name"></span>
      <button type="button" class="row__cancel" hidden>
        <svg width="15" height="15" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="fdm-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="fdm-progress__fill"></div>
    </div>
    <div class="row__meta">
      <span class="row__size fdm-size"></span>
      <span class="row__spacer"></span>
      <span class="row__speed fdm-speed"></span>
      <span class="row__eta fdm-eta"></span>
    </div>
    <p class="row__detail" hidden></p>
  </li>
</template>

<script src="lib/format.js"></script>
<script src="popup.js"></script>
</body>
</html>
