      @keyframes n4{0%,35.990%{opacity:0} 36.000%,38.990%{opacity:1} 39.000%,100%{opacity:0}}
      @keyframes n5{0%,38.990%{opacity:0} 39.000%,41.990%{opacity:1} 42.000%,100%{opacity:0}}
      @keyframes n6{0%,41.990%{opacity:0} 42.000%,44.990%{opacity:1} 45.000%,100%{opacity:0}}
      @keyframes n7{0%,44.990%{opacity:0} 45.000%,47.990%{opacity:1} 48.000%,100%{opacity:0}}
      @keyframes n8{0%,47.990%{opacity:0} 48.000%,50.990%{opacity:1} 51.000%,100%{opacity:0}}
      @keyframes n9{0%,50.990%{opacity:0} 51.000%,53.990%{opacity:1} 54.000%,100%{opacity:0}}
      @keyframes n10{0%,53.990%{opacity:0} 54.000%,56.990%{opacity:1} 57.000%,100%{opacity:0}}
      @keyframes n11{0%,56.990%{opacity:0} 57.000%,59.990%{opacity:1} 60.000%,100%{opacity:0}}
      @keyframes n12{0%,59.990%{opacity:0} 60.000%,62.990%{opacity:1} 63.000%,100%{opacity:0}}
      @keyframes n13{0%,62.990%{opacity:0} 63.000%,65.990%{opacity:1} 66.000%,100%{opacity:0}}
      @keyframes n14{0%,65.990%{opacity:0} 66.000%,68.990%{opacity:1} 69.000%,100%{opacity:0}}
      @keyframes n15{0%,68.990%{opacity:0} 69.000%,71.990%{opacity:1} 72.000%,100%{opacity:0}}
      @keyframes n16{0%,71.990%{opacity:0} 72.000%,74.990%{opacity:1} 75.000%,100%{opacity:0}}
      @keyframes n17{0%,74.990%{opacity:0} 75.000%,77.990%{opacity:1} 78.000%,100%{opacity:0}}
      @keyframes n18{0%,77.990%{opacity:0} 78.000%,80.990%{opacity:1} 81.000%,100%{opacity:0}}
      @keyframes n19{0%,80.990%{opacity:0} 81.000%,83.990%{opacity:1} 84.000%,100%{opacity:0}}
      .sA{animation:sceneA 9s steps(1,end) infinite}
      .sB{animation:sceneB 9s steps(1,end) infinite}
      .sC{animation:sceneC 9s steps(1,end) infinite}
      .bar{animation:fill 9s cubic-bezier(.2,.7,.3,1) infinite}
      .cur{animation:cursor 9s cubic-bezier(.4,0,.2,1) infinite,sceneA 9s steps(1,end) infinite}
      .press{animation:press 9s linear infinite}
      .n0{animation:n0 9s steps(1,end) infinite}
      .n1{animation:n1 9s steps(1,end) infinite}
      .n2{animation:n2 9s steps(1,end) infinite}
      .n3{animation:n3 9s steps(1,end) infinite}
      .n4{animation:n4 9s steps(1,end) infinite}
      .n5{animation:n5 9s steps(1,end) infinite}
      .n6{animation:n6 9s steps(1,end) infinite}
      .n7{animation:n7 9s steps(1,end) infinite}
      .n8{animation:n8 9s steps(1,end) infinite}
      .n9{animation:n9 9s steps(1,end) infinite}
      .n10{animation:n10 9s steps(1,end) infinite}
      .n11{animation:n11 9s steps(1,end) infinite}
      .n12{animation:n12 9s steps(1,end) infinite}
      .n13{animation:n13 9s steps(1,end) infinite}
      .n14{animation:n14 9s steps(1,end) infinite}
      .n15{animation:n15 9s steps(1,end) infinite}
      .n16{animation:n16 9s steps(1,end) infinite}
      .n17{animation:n17 9s steps(1,end) infinite}
      .n18{animation:n18 9s steps(1,end) infinite}
      .n19{animation:n19 9s steps(1,end) infinite}
