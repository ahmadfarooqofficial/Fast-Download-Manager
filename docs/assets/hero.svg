      @keyframes sceneB{0%,23.990%{opacity:0} 24.000%,83.990%{opacity:1} 84.000%,100%{opacity:0}}
      @keyframes sceneC{0%,83.990%{opacity:0} 84.000%,99.990%{opacity:1}}
      @keyframes fill{0%,24%{width:0}84%,100%{width:760px}}
