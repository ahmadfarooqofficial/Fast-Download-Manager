# Greets whoever opens an issue, and — where it can tell what they are describing
# — points them at the version that already fixes it.
#
# The point is not politeness. Most reports arrive from people running an older
# build, so the single most useful thing to say first is "this may already be
# fixed, here is how to check". Everything else is asking for the details that
# would otherwise cost a round trip each.
#
# To teach it a new problem, add an entry to KNOWN below. Keep `hint` to one or
# two sentences: a reply nobody reads helps nobody.
name: Thank New Issue Reporter

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  thank-reporter:
    runs-on: ubuntu-latest
    steps:
      # Every issue lands on the maintainer, so nothing sits unowned. Uses the
      # repository owner rather than a hardcoded name, so it survives a rename.
      - name: Assign to the maintainer
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: context.issue.number,
                assignees: [context.repo.owner],
              });
            } catch (err) {
              // Assignment needs push access; never fail the run over it, the
              // reply below is the part that matters to the reporter.
              core.warning(`Could not assign the issue: ${err.message}`);
            }

      # This greets the owner's own issues too, which is what makes it testable
      # without a second account. To stop that, add back:
      #   if: github.event.issue.user.login != github.repository_owner
      - name: Post thank-you and triage hints
        uses: actions/github-script@v7
        with:
          script: |
            const LATEST = 'v0.1.18';
            const RELEASES = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/latest`;

            // Matched against the lowercased title + body. Keywords include the
            // Russian and Spanish a reporter is likely to actually type, because
            // the people hitting these bugs are not all writing in English.
            const KNOWN = [
              {
                name: 'window dragging',
                keywords: ['drag the window', 'move the window', "can't move", 'cannot move',
                           'window not moving', 'перетаск', 'переместить окно'],
                hint: 'Window dragging was broken by a missing permission and is fixed in **v0.1.11**.'
              },
              {
                name: 'missing VCRUNTIME',
                keywords: ['vcruntime', 'msvcp140', 'code execution cannot proceed',
                           'dll was not found', 'не удалось запустить'],
                hint: 'That crash was a missing Visual C++ runtime dependency. **v0.1.12** links it in, so nothing extra needs installing.'
              },
              {
                name: 'no download progress',
                keywords: ['connecting to server', 'no progress', 'progress bar stuck',
                           'stuck at 0', 'no speed', 'нет прогресса'],
                hint: 'A progress bar stuck on "Connecting to server…" for the whole download is fixed in **v0.1.13** — speed, size and time remaining all report live now.'
              },
              {
                name: 'language',
                keywords: ['language', 'russian', 'русск', 'idioma', 'translate', 'translation',
                           'english only', 'на русском'],
                hint: 'FDM ships in 12 languages since **v0.1.12**. It follows your Windows language, and you can change it in **Settings → Language**.'
              },
              {
                name: 'tiny or corrupt file',
                keywords: ['few kb', 'only kb', 'small file', 'corrupt', 'incomplete file',
                           'wrong size', 'html instead'],
                hint: 'Downloads landing as a few KB were caused by hosts rejecting the old user agent. Fixed in **v0.1.12**.'
              },
              {
                name: 'drag out',
                keywords: ['drag out', 'drag the file', 'drag to desktop', 'drag and drop',
                           'drop the file'],
                hint: 'Dragging a finished download out to Explorer or the desktop works from **v0.1.15**, from both the completion popup and the main list.'
              },
              {
                name: 'download location',
                keywords: ['save location', 'download folder', 'change folder', 'save to',
                           'wrong folder', 'папк'],
                hint: 'Per-category folders live in **Settings** since **v0.1.12**, and the download popup lets you redirect a single download with the folder button.'
              },
              {
                name: 'slow youtube',
                keywords: ['slow', 'takes long', 'youtube slow', 'long time to start', 'медленно'],
                hint: 'YouTube extraction got roughly 40% faster in **v0.1.15**, and yt-dlp is warmed up at startup so the first video is no longer the slow one.'
              },
              {
                name: 'duplicate or ghost tray icon',
                keywords: ['two icons', 'two tray', 'two app icons', 'duplicate icon', 'second icon',
                           'ghost icon', 'tray icon', 'system tray', 'notification area',
                           'две иконки', 'иконк', 'bandeja'],
                hint: 'Two FDM icons in the tray — one of them a dead "ghost" that answers to nothing — is fixed in **v0.1.16**. The icon was being created twice, and launching FDM a second time left one behind.'
              },
              {
                name: 'open folder goes to the wrong place',
                keywords: ['open folder', 'open in folder', 'folder opened', 'incorrect folder',
                           'opens the wrong', 'show in folder', 'открыть папку', '打开文件夹'],
                hint: '"Open Folder" landing in the wrong place, or doing nothing, is fixed in **v0.1.17** — the file path was being mangled on its way to Explorer.'
              },
              {
                name: 'wrong category badge',
                keywords: ['category', 'classification', 'wrong label', 'label shows', 'categoría',
                           'категор', '分类'],
                hint: 'The category badge in the download popup used to say "Video" for everything until the download started. From **v0.1.17** it shows the real category from the moment the popup opens.'
              },
              {
                name: 'file not deleted with the task',
                keywords: ['not deleted', 'was not deleted', 'delete the file', 'local file', 'delete task',
                           'deleting the task', 'remove the file', 'файл не удал', '删除文件', '没有删除'],
                hint: 'Removing a finished download now asks whether to delete the file from disk as well, from **v0.1.17**. Before that, "Remove" only ever took the row out of the list.'
              },
              {
                name: 'deleted downloads come back / blank popup',
                keywords: ['reappear', 'come back', 'came back', 'zombie', 'after restart', 'after reboot',
                           'white window', 'blank window', 'empty window', 'white popup', '白', '空白窗口',
                           'снова появ', 'белое окно'],
                hint: 'Deleted downloads coming back after a restart, and a blank white popup window, are both fixed in **v0.1.18**. A save of the list could be lost to a file lock right before shutdown, and a popup opened during startup could come up empty.'
              },
              {
                name: 'main window shows 0 B/s or too many connections',
                keywords: ['0 b/s', '0 conns', 'not synchronized', 'not in sync', 'out of sync',
                           'conns', 'connections', 'speed jumps', 'speed changes rapidly', 'flicker',
                           '连接', '不同步', 'скорость 0', 'соединени'],
                hint: 'The main window showing "0 B/s · ETA --:--:-- · 0/N conns" while the popup shows the real speed, a connection count in the hundreds, and a speed reading that jumps too fast to follow are all fixed in **v0.1.18**.'
              },
              {
                name: 'extension not capturing',
                keywords: ['extension', 'not capturing', 'chrome', 'browser download',
                           'not intercept', 'does not catch'],
                hint: 'Check the toolbar icon: clicking it toggles capture, and it greys out with a slash while capture is off. Chrome also asks you to enable the extension once after installing — it does not allow an installer to do that for you.'
              },
              {
                name: 'yt-dlp missing',
                keywords: ['yt-dlp', 'ytdlp', 'yt dlp is missing', 'tools folder'],
                hint: 'That means `yt-dlp.exe` is not in the tools folder. Reinstalling with the latest setup puts it there.'
              },
            ];

            const issue = context.payload.issue;
            const haystack = `${issue.title}\n${issue.body || ''}`.toLowerCase();
            const matched = KNOWN.filter(k => k.keywords.some(w => haystack.includes(w)));

            const lines = [
              `Thanks for opening this, @${issue.user.login} — I appreciate you taking the time.`,
              ``,
            ];

            if (matched.length) {
              lines.push(
                `This looks like it may be something already fixed. **The latest release is ${LATEST}** — if you are on an older build, please update first:`,
                ``,
                ...matched.map(m => `- ${m.hint}`),
                ``,
                `Download: ${RELEASES}`,
                ``,
                `If you are already on ${LATEST} and still hitting it, say so and I will dig in.`,
                ``
              );
            } else {
              lines.push(
                `I read every issue and will get back to you. FDM is maintained by one person in his spare time, so it may take a few days.`,
                ``
              );
            }

            lines.push(
              `<details><summary>What helps me fix it faster</summary>`,
              ``,
              `- Your FDM version (**Settings → About**) and Windows version`,
              `- What you did, what happened, and what you expected instead`,
              `- The link you were downloading, if it is not private`,
              `- Whether it happens every time or just once`,
              ``,
              `</details>`,
              ``,
              `FDM is free and open source — thanks for helping make it better.`
            );

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
