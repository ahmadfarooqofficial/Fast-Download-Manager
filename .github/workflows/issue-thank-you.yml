name: Thank New Issue Reporter

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  thank-reporter:
    runs-on: ubuntu-latest
    steps:
      - name: Post thank-you comment
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.issue.user.login;
            const issue_number = context.issue.number;
            const body = `Thank you @${username} for reporting this bug.\nAhmad Farooq will review it and we hope to resolve it within a week—thanks again for contributing.`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body
            });
