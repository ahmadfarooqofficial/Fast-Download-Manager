[package]
name = "fdm-ipc"
description = "Named-pipe IPC so a second process can reach the running FDM download list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
fdm-core = { path = "../fdm-core" }
fdm-manager = { path = "../fdm-manager" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# `net` is the named pipe itself; `io-util` is `split` and the async read/write
# extension traits the framing is built on.
tokio = { workspace = true, features = ["net", "io-util"] }

[target.'cfg(windows)'.dependencies]
# Only for the pipe's security descriptor and the current user's SID, both of
# which decide who is allowed to send commands to the download list. See
# `src/security.rs`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
