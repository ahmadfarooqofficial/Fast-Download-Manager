[package]
name = "fdm-manager"
description = "The download list: registry, queue, pause/resume and persistence on top of fdm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
fdm-core = { path = "../fdm-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `net` and `io-util` are for the throttled test server in tests/common: the
# manager's behaviour is mostly about timing, and a server on the internet gives
# no control over when a chunk arrives.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
