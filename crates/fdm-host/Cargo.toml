[package]
name = "fdm-host"
description = "Chrome native messaging host: bridges the FDM browser extension to the download engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "fdm-host"
path = "src/main.rs"

[dependencies]
fdm-core = { path = "../fdm-core" }
fdm-ipc = { path = "../fdm-ipc" }
fdm-manager = { path = "../fdm-manager" }
tokio = { workspace = true, features = ["fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
