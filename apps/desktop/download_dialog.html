<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDM — Download Progress</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dialog-body">
  <!-- Custom Drag Titlebar -->
  <header data-tauri-drag-region class="titlebar dialog-titlebar">
    <div class="titlebar-brand" data-tauri-drag-region>
      <svg class="brand-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7V17L12 22L21 17V7L12 2Z" stroke="#e50914" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12 6V16M12 16L8 12M12 16L16 12" stroke="#e50914" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">FDM</span>
      <span class="brand-subtitle">Download Status</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="dialog-minimize" title="Minimize" aria-label="Minimize">
        <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn btn-close" id="dialog-close" title="Close" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </header>

  <!-- IDM Style Dialog Content -->
  <main class="dialog-content">
    <!-- File Header Card -->
    <div class="dialog-file-card">
      <div class="dialog-file-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
          <polyline points="13 2 13 9 20 9"></polyline>
        </svg>
      </div>
      <div class="dialog-file-info">
        <div class="dialog-filename" id="dlg-filename">Connecting…</div>
        <div class="dialog-url" id="dlg-url">—</div>
      </div>
    </div>

    <!-- Live Progress Bar -->
    <div class="dialog-progress-wrapper">
      <div class="fdm-progress" id="dlg-progress-bar" data-state="running" style="--fdm-value: 0; --fdm-segments: 8;"></div>
    </div>

    <!-- Status & Metrics Grid -->
    <div class="dialog-grid">
      <div class="dlg-cell">
        <span class="dlg-label">Status:</span>
        <span class="dlg-val" id="dlg-status">Connecting…</span>
      </div>
      <div class="dlg-cell">
        <span class="dlg-label">File size:</span>
        <span class="dlg-val" id="dlg-size">—</span>
      </div>
      <div class="dlg-cell">
        <span class="dlg-label">Transfer rate:</span>
        <span class="dlg-val highlight-speed" id="dlg-speed">0 B/s</span>
      </div>
      <div class="dlg-cell">
        <span class="dlg-label">Time left:</span>
        <span class="dlg-val" id="dlg-eta">—</span>
      </div>
      <div class="dlg-cell">
        <span class="dlg-label">Resume capability:</span>
        <span class="dlg-val" id="dlg-resume">Yes</span>
      </div>
      <div class="dlg-cell">
        <span class="dlg-label">Save to:</span>
        <span class="dlg-val dlg-path" id="dlg-path">—</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <footer class="dialog-actions">
      <div class="dialog-actions-left">
        <button class="btn btn-secondary" id="dlg-btn-manager" title="Open Full Fast Download Manager Window">
          Open Manager
        </button>
      </div>
      <div class="dialog-actions-right">
        <button class="btn btn-secondary" id="dlg-btn-folder" title="Open containing folder" disabled>
          Open Folder
        </button>
        <button class="btn btn-secondary" id="dlg-btn-open" title="Open downloaded file" style="display: none;">
          Open File
        </button>
        <button class="btn btn-secondary" id="dlg-btn-pause">
          Pause
        </button>
        <button class="btn btn-danger" id="dlg-btn-cancel">
          Cancel
        </button>
      </div>
    </footer>
  </main>

  <script src="download_dialog.js"></script>
</body>
</html>
