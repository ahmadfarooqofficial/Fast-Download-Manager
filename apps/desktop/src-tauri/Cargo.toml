[package]
name = "fdm-desktop"
version = "0.1.14"
description = "Fast Download Manager"
authors = ["Ahmad Farooq"]
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "fdm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Native folder picker, for choosing where a category — or one download — lands.
tauri-plugin-dialog = "2"
# Dragging a finished file out of the popup and into Explorer, the desktop, or
# another app — the way IDM does. An HTML5 dragstart cannot do this: the shell
# needs a real OLE drag carrying CF_HDROP, which this starts natively.
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
reqwest = { workspace = true }
fdm-manager = { path = "../../../crates/fdm-manager" }
fdm-ipc = { path = "../../../crates/fdm-ipc" }
fdm-core = { path = "../../../crates/fdm-core" }
